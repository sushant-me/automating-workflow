name: Autonomous Daily Python Push

on:
  schedule:
    # Runs every day at 00:00 UTC (100% cloud-based on GitHub's servers)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub UI

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Execute Daily Python Script
        run: |
          python main.py

      - name: 🚀 Commit and Push Changes to GitHub
        env:
          GIT_AUTHOR_NAME: "sushant-me"
          GIT_AUTHOR_EMAIL: "sushant.poudel2028@gmail.com"
          GIT_COMMITTER_NAME: "sushant-me"
          GIT_COMMITTER_EMAIL: "sushant.poudel2028@gmail.com"
        run: |
          git config --global user.name "sushant-me"
          git config --global user.email "sushant.poudel2028@gmail.com"
          git add -A
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --author="sushant-me <sushant.poudel2028@gmail.com>" -m "🤖 Auto update: Python daily commit - $COMMIT_DATE"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes detected to commit."
          fi
